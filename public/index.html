<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis Dashboard</title>
<style>
:root {
  color-scheme: dark;
  --bg: #04080c; --panel: rgba(7, 16, 24, 0.62); --line: rgba(34, 211, 238, 0.22); --line-soft: rgba(34, 211, 238, 0.10);
  --cyan: #35e0f5; --cyan-dim: #1a8fa3; --amber: #ffd24a; --orange: #ff8a3d; --red: #ff5b5b; --violet: #b98cff; --green: #33e08a;
  --ink: #d6f3fa; --dim: #89b0bd;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0; color: var(--ink); min-height: 100vh;
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background:
    radial-gradient(900px 600px at 50% 26%, rgba(34,211,238,0.13), transparent 60%),
    radial-gradient(700px 500px at 85% 90%, rgba(255,138,61,0.07), transparent 60%),
    linear-gradient(180deg, #071119, #04080c 60%);
}
.scan { position: fixed; inset: 0; pointer-events: none; z-index: 40;
  background: repeating-linear-gradient(180deg, rgba(255,255,255,0.026) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
.vig { position: fixed; inset: 0; pointer-events: none; z-index: 39; box-shadow: inset 0 0 240px rgba(0,0,0,0.88); }

#boot { position: fixed; inset: 0; z-index: 60; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
#boot.hide { animation: bootOut .5s ease forwards; }
#boot .bmark { font: 700 15px/1 var(--mono); letter-spacing: 12px; color: var(--cyan); text-shadow: 0 0 18px rgba(53,224,245,.6); }
#boot .bbar { width: 190px; height: 2px; background: rgba(53,224,245,.18); overflow: hidden; }
#boot .bbar i { display: block; height: 100%; width: 0; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); animation: fill .85s ease forwards; }
#boot .bmsg { font: 11px/1 var(--mono); letter-spacing: 2.6px; color: var(--dim); }
#boot .bsign { margin-top: 6px; font: 700 11px/1 var(--mono); letter-spacing: 1.8px; color: var(--cyan);
  border: 1px solid var(--line); background: rgba(53,224,245,.08); padding: 10px 18px; cursor: pointer; }
#boot .bsign:hover { background: var(--cyan); color: #04080c; }
@keyframes fill { to { width: 100% } }
@keyframes bootOut { to { opacity: 0; visibility: hidden } }

.wrap { max-width: 1160px; margin: 0 auto; padding: 20px 18px 60px; position: relative; z-index: 1; }
.wrap.rise { animation: rise .6s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }

/* Dial on the left, content panel on the right — side by side above ~860px,
   stacked (dial on top) below it so this still works on a phone. */
.layout { display: flex; gap: 36px; align-items: flex-start; }
.leftcol { flex: 0 0 440px; position: sticky; top: 24px; }
.rightcol { flex: 1 1 0; min-width: 0; }
@media (max-width: 860px) {
  .layout { flex-direction: column; }
  .leftcol { position: static; flex-basis: auto; width: 100%; }
  .rightcol { width: 100%; }
}

/* ================= DIAL ================= */
.dialwrap { container-type: inline-size; max-width: 440px; margin: 0 auto; }
.dial { position: relative; width: 100%; aspect-ratio: 1; }
.dial svg.chrome { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.spin { transform-origin: 260px 260px; animation: spin 90s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

.core {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 38cqw; height: 38cqw; border-radius: 50%; padding: 4.4cqw;
  background: radial-gradient(circle at 50% 38%, #0d2530, #050d13 70%);
  border: 1px solid rgba(53,224,245,.35);
  box-shadow: 0 0 0 6px rgba(53,224,245,.05), 0 0 60px rgba(53,224,245,.28), inset 0 0 40px rgba(53,224,245,.12);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .25cqw;
  text-align: center; z-index: 3;
}
.core::before {
  content: ""; position: absolute; inset: 6%; border-radius: 50%;
  border: 2px solid var(--cyan); box-shadow: 0 0 26px rgba(53,224,245,.55), inset 0 0 22px rgba(53,224,245,.28);
  opacity: .9; pointer-events: none;
}
.core > div { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.core .cloc { font: 700 clamp(10px,1.8cqw,12px)/1.2 var(--mono); letter-spacing: .22em; color: var(--cyan-dim); }
.core .ctime { font: 700 clamp(14px,4.4cqw,22px)/1.2 var(--mono); color: var(--cyan); letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; text-shadow: 0 0 24px rgba(53,224,245,.5); }
.core .cdate { font: clamp(10px,1.8cqw,13px)/1.3 var(--mono); letter-spacing: .1em; color: var(--ink); text-transform: uppercase; }
.core .cname { font: clamp(10px,1.7cqw,12px)/1.4 var(--mono); color: var(--dim); letter-spacing: .02em; margin-top: .4cqw; }

.lobe {
  position: absolute; transform: translate(-50%, -50%);
  width: 22cqw; height: 22cqw; border-radius: 50%; padding: 3cqw;
  background: radial-gradient(circle at 50% 35%, #10202a, #060e14 72%);
  border: 1px solid rgba(255,255,255,.06);
  box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 6px 22px rgba(0,0,0,.55);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15cqw;
  cursor: pointer; z-index: 4; color: inherit; font: inherit;
  transition: transform .18s ease, box-shadow .18s ease;
}
.lobe > span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lobe::before {
  content: ""; position: absolute; inset: 8%; border-radius: 50%;
  border: 2px solid var(--c); opacity: .55; transition: .18s;
  box-shadow: 0 0 14px color-mix(in srgb, var(--c) 55%, transparent);
}
.lobe:hover { transform: translate(-50%, -50%) scale(1.05); }
.lobe:hover::before { opacity: .9; }
.lobe[aria-selected="true"] { transform: translate(-50%, -50%) scale(1.08); }
.lobe[aria-selected="true"]::before { opacity: 1; inset: 5%; border-width: 2.5px;
  box-shadow: 0 0 26px var(--c), inset 0 0 22px color-mix(in srgb, var(--c) 30%, transparent); }
.lobe[aria-selected="true"] { box-shadow: 0 0 46px color-mix(in srgb, var(--c) 45%, transparent); }
.lobe .lglyph { font-size: clamp(13px,4cqw,22px); line-height: 1; color: var(--c); text-shadow: 0 0 12px var(--c); }
.lobe .lcount { font: 700 clamp(11px,3.4cqw,19px)/1 var(--mono); color: #fff; font-variant-numeric: tabular-nums; }
.lobe .llabel { font: 700 clamp(10px,1.7cqw,11px)/1.2 var(--mono); letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
.lobe[aria-selected="true"] .llabel { color: var(--c); }
.lobe:focus-visible { outline: 2px solid var(--c); outline-offset: 4px; }

/* ================= ASSESSMENT ================= */
.assess { position: relative; margin: 0 0 20px; padding: 13px 16px 13px 19px;
  background: linear-gradient(90deg, rgba(53,224,245,.09), rgba(53,224,245,.015));
  border: 1px solid var(--line); border-left: 2px solid var(--cyan); }
.assess .lbl { display: block; font: 700 10px/1 var(--mono); letter-spacing: 2.6px; color: var(--cyan); margin-bottom: 8px; }
#assessText { font-size: 15px; line-height: 1.5; color: #e6f8fd; }

/* ================= CONTENT PANEL ================= */
.stage { max-width: none; }
section.panel { position: relative; background: var(--panel); border: 1px solid var(--line); }
section.panel::before, section.panel::after { content: ""; position: absolute; width: 13px; height: 13px;
  border: 1px solid var(--acc, var(--cyan)); pointer-events: none; }
section.panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
section.panel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
.phead { display: flex; align-items: center; gap: 10px; padding: 12px 15px;
  border-bottom: 1px solid var(--line-soft); background: rgba(255,255,255,.02); }
.phead .glyph { color: var(--acc); font-size: 15px; text-shadow: 0 0 10px var(--acc); }
.phead h2 { margin: 0; font: 700 12px/1 var(--mono); letter-spacing: 2.4px; text-transform: uppercase; color: var(--acc); }
.count { margin-left: auto; font: 700 11px/1 var(--mono); letter-spacing: 1px; color: #04080c;
  background: var(--acc); padding: 4px 8px; }
.pbody { padding: 4px 0; max-height: 64vh; min-height: 120px; overflow-y: auto; }
.pbody::-webkit-scrollbar { width: 6px; }
.pbody::-webkit-scrollbar-thumb { background: rgba(53,224,245,.25); }

.row { padding: 10px 15px; border-bottom: 1px solid rgba(53,224,245,.07); display: flex; gap: 11px; align-items: flex-start; }
.row:last-child { border-bottom: 0; }
.row:hover { background: rgba(53,224,245,.055); }
.tick { width: 2px; flex: 0 0 2px; align-self: stretch; background: rgba(53,224,245,.28); }
.tick.act { background: var(--amber); box-shadow: 0 0 9px var(--amber); }
.tick.stale { background: var(--red); box-shadow: 0 0 9px var(--red); }
.tick.ok { background: var(--green); box-shadow: 0 0 9px var(--green); }
.tick.now { background: var(--red); box-shadow: 0 0 13px var(--red); animation: pulse 1.4s ease-in-out infinite; }
.rmain { min-width: 0; flex: 1; }
.rtitle { font-weight: 500; font-size: 15px; color: #e4f7fc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rtitle a { color: inherit; text-decoration: none; }
.rtitle a:hover { color: var(--acc); }
.rmeta { font: 12.5px/1.5 var(--mono); color: var(--dim); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.time { font: 700 13px/1.45 var(--mono); color: var(--acc); flex: 0 0 96px; font-variant-numeric: tabular-nums; }
.time small { display: block; font-weight: 400; color: var(--dim); }
.cancelled .rtitle { text-decoration: line-through; color: var(--dim); }

.pill { display: inline-block; font: 700 10px/1 var(--mono); letter-spacing: 1px;
  padding: 4px 6px; margin-right: 6px; vertical-align: 1px; border: 1px solid transparent; }
.pill.act { background: rgba(255,210,74,.14); color: var(--amber); border-color: rgba(255,210,74,.4); }
.pill.new { background: rgba(255,91,91,.15); color: var(--red); border-color: rgba(255,91,91,.45); }
.pill.age { background: rgba(53,224,245,.08); color: var(--dim); border-color: var(--line-soft); }
.pill.age.warn { background: rgba(255,210,74,.14); color: var(--amber); border-color: rgba(255,210,74,.4); }
.pill.age.bad { background: rgba(255,91,91,.15); color: var(--red); border-color: rgba(255,91,91,.45); }
.pill.ok { background: rgba(51,224,138,.13); color: var(--green); border-color: rgba(51,224,138,.4); }
.pill.join { background: rgba(53,224,245,.12); color: var(--cyan); border-color: var(--line); text-decoration: none; }
.pill.join:hover { background: var(--cyan); color: #04080c; }

.open-link { font: 700 10.5px/1 var(--mono); letter-spacing: 1.2px; text-transform: uppercase; color: var(--acc);
  text-decoration: none; border: 1px solid var(--line); padding: 6px 9px; white-space: nowrap; transition: .15s;
  flex: 0 0 auto; align-self: center; }
.open-link:hover { background: var(--acc); color: #04080c; }

.counts { display: flex; gap: 6px; flex: 0 0 auto; align-self: center; }
.stat { text-align: center; min-width: 30px; }
.stat b { display: block; font: 700 15px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font: 10px/1.4 var(--mono); letter-spacing: .5px; color: var(--dim); text-transform: uppercase; }

.tabs { display: flex; gap: 6px; padding: 11px 15px 3px; }
.tab { font: 700 11px/1 var(--mono); letter-spacing: 1.2px; text-transform: uppercase; background: transparent;
  border: 1px solid var(--line-soft); color: var(--dim); padding: 7px 10px; cursor: pointer; transition: .15s; }
.tab:hover { color: var(--acc); border-color: var(--acc); }
.tab[aria-selected="true"] { background: color-mix(in srgb, var(--acc) 18%, transparent); border-color: var(--acc); color: var(--acc); }

.empty { padding: 26px 15px; color: var(--dim); font: 13px/1.6 var(--mono); letter-spacing: .3px; }
.err { padding: 14px; color: var(--red); font: 12.5px/1.5 var(--mono); border-left: 2px solid var(--red); background: rgba(255,91,91,.1); }
.skel { padding: 26px 15px; color: var(--cyan-dim); font: 12px/1.4 var(--mono); letter-spacing: 2.2px; text-transform: uppercase; }
.skel::after { content: " ▮"; animation: pulse 1s steps(2) infinite; }
.stamp { padding: 9px 15px; border-bottom: 1px solid var(--line-soft); font: 11px/1.5 var(--mono); letter-spacing: .5px; color: var(--dim); background: rgba(255,255,255,.02); }
.stamp b { color: var(--acc); }
.divider { padding: 8px 15px; font: 700 10.5px/1 var(--mono); letter-spacing: 2px; text-transform: uppercase;
  color: var(--dim); border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
footer { margin-top: 22px; font: 11px/1.6 var(--mono); letter-spacing: 1.3px; text-transform: uppercase;
  color: var(--cyan-dim); text-align: center; opacity: .6; display: flex; justify-content: center; gap: 16px; }
footer button { background: none; border: 0; color: inherit; font: inherit; letter-spacing: inherit; cursor: pointer; opacity: .8; }
footer button:hover { color: var(--cyan); opacity: 1; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="scan"></div><div class="vig"></div>

<div id="boot">
  <div class="bmark">J A R V I S</div>
  <div class="bbar"><i></i></div>
  <div class="bmsg" id="bootMsg">ESTABLISHING UPLINK</div>
  <button class="bsign" id="signInBtn" hidden type="button">SIGN IN WITH MICROSOFT</button>
</div>

<div class="wrap" id="wrap" hidden>
  <div class="layout">
    <div class="leftcol">
      <div class="dialwrap">
        <div class="dial" id="dial">
          <svg class="chrome" viewBox="0 0 520 520" aria-hidden="true">
            <defs>
              <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#35e0f5"/><stop offset="1" stop-color="#35e0f5" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="gB" x1="1" y1="1" x2="0" y2="0">
                <stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <circle cx="260" cy="260" r="252" fill="none" stroke="rgba(53,224,245,.10)" stroke-width="1"/>
            <g class="spin">
              <circle cx="260" cy="260" r="243" fill="none" stroke="rgba(53,224,245,.45)" stroke-width="11" stroke-dasharray="2 11" opacity=".55"/>
            </g>
            <path d="M 34 300 A 226 226 0 0 1 122 100" fill="none" stroke="url(#gA)" stroke-width="3" opacity=".85"/>
            <path d="M 486 220 A 226 226 0 0 1 398 420" fill="none" stroke="url(#gB)" stroke-width="3" opacity=".85"/>
            <circle cx="260" cy="260" r="196" fill="none" stroke="rgba(53,224,245,.13)" stroke-width="1"/>
          </svg>
          <div class="core" id="core"></div>
          <!-- lobes injected -->
        </div>
      </div>
    </div>

    <div class="rightcol">
      <div class="assess"><span class="lbl">◈ ASSESSMENT</span><span id="assessText" class="skel">Analysing</span></div>

      <div class="stage">
        <section class="panel" id="panel">
          <div class="phead"><span class="glyph" id="pGlyph">◈</span><h2 id="pTitle">Today</h2><span class="count" id="pCount">–</span></div>
          <div id="pTabs"></div>
          <div class="pbody" id="pBody"><div class="skel">Awaiting uplink</div></div>
        </section>
      </div>
    </div>
  </div>

  <footer>
    <span>Microsoft Graph + Autotask · your own credentials, for your eyes only</span>
    <button id="signOutBtn" type="button">Sign out</button>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.26.1/lib/msal-browser.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
